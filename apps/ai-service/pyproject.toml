[project]
name = "medvault-ai"
version = "0.0.0"
description = "MedVault FastAPI AI service for clinical NLP, ASR, recurrence, and OCR"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.5",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
  "torch>=2.1",
  "transformers>=4.40",
  "faster-whisper>=1.0",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.0",
]
eval = [
  "pytest>=8.0",
  "jiwer>=3.0",
  "seqeval>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
